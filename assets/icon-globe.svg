<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <!-- Manual vector redraw of Fugue Icons' "globe.png" (Yusuke Kamiyamane, CC BY 3.0),
       traced to a 16-unit grid per nativemind-adminka/guidelines/adminka-icons.html's
       "manual vector redraw" route — silhouette + palette kept, nothing invented.
       Added for the SimBox admin-panel language selector (no globe/language glyph
       existed in assets/icons/ or assets/adminka/ before this). -->
  <defs>
    <radialGradient id="icon-globe-sphere" cx="6" cy="5.5" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BEE1FA"></stop>
      <stop offset="0.55" stop-color="#6FB3E8"></stop>
      <stop offset="1" stop-color="#2D6FB0"></stop>
    </radialGradient>
    <clipPath id="icon-globe-clip">
      <circle cx="8" cy="8" r="6.5"></circle>
    </clipPath>
  </defs>
  <circle cx="8" cy="8" r="6.5" fill="url(#icon-globe-sphere)" stroke="#1C4C82" stroke-width="1"></circle>
  <g clip-path="url(#icon-globe-clip)" stroke="#F2F9FF" stroke-width="0.75" stroke-linecap="round" opacity="0.85">
    <path d="M1.5 8 H14.5"></path>
    <path d="M1.5 5 H14.5"></path>
    <path d="M1.5 11 H14.5"></path>
    <ellipse cx="8" cy="8" rx="2.5" ry="6.5"></ellipse>
    <ellipse cx="8" cy="8" rx="5.5" ry="6.5"></ellipse>
    <path d="M8 1.5 V14.5"></path>
  </g>
</svg>
